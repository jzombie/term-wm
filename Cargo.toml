[package]
name = "term-wm"
description = "The Spatial Terminal Desktop Environment for Remote Workspaces: floating windows, BSP tiling, persistent sessions, and zero-prefix input passthrough over SSH."
keywords = ["terminal", "tui", "window-manager", "ssh", "workspace"]
categories = [
    "command-line-utilities",
    "emulators",
    "gui",
    "concurrency",
    "network-programming",
]
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["term-bench"]

[workspace]
members = [
    "crates/term-bench",
    "crates/term-clipboard",
    "crates/term-logging",
    "crates/term-session",
    "crates/term-session-client",
    "crates/term-session-mock",
    "crates/term-session-muxio-service-definitions",
    "crates/term-session-server",
    "crates/term-size-box",
    "crates/term-sys-io",
    "crates/term-test-support",
    "crates/term-wm-config",
    "crates/term-wm-console",
    "crates/term-wm-core",
    "crates/term-wm-crossterm-adapter",
    "crates/term-wm-events",
    "crates/term-wm-layout-engine",
    "crates/term-wm-pty-engine",
    "crates/term-wm-render",
    "crates/term-wm-sys-ui-components",
    "crates/term-wm-ui-components",
    "crates/term-wm-ui-facade",
    "crates/term-wm-view",
]
resolver = "2"

[workspace.package]
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.10.5-alpha"
edition = "2024"
repository = "https://github.com/jzombie/term-wm"
license = "MIT OR Apache-2.0"
publish = true

[workspace.dependencies]
arboard = "3.6.1"
arc-swap = "1.9.2"
base64 = "0.23.0"
bitcode = "0.6.9"
bitflags = "2.13.1"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.4"
criterion = { version = "0.8.2", default-features = false }
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
ctrlc = "3.5.2"
dirs = "5.0"
hostname = "0.4.2"
indoc = "2.0.7"
insta = "1.48.0"
interprocess = "2.4.3"
json_comments = "0.2.2"
libc = "0.2.186"
line-ending = "1.5.1"
linkify = "0.11.0"
muxio-core = "0.15.0-alpha"
muxio-rpc-service = "0.15.0-alpha"
muxio-rpc-service-caller = "0.15.0-alpha"
muxio-rpc-service-endpoint = "0.15.0-alpha"
muxio-tokio-mpsc-adapter = "0.15.0-alpha"
muxio-tokio-rpc-ipc-client = "0.15.0-alpha"
muxio-tokio-rpc-ipc-server = "0.15.0-alpha"
nucleo-matcher = { version = "0.3", features = ["unicode-casefold", "unicode-normalization", "unicode-segmentation"] }
portable-pty = "0.9.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
pulldown-cmark = "0.13.0"
quote = "1.0.47"
ratatui = "0.30.0"
resvg = "0.48.1"
rstml = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial_test = "4.0.1"
shell-words = "1.1.1"
slotmap = "1.1"
smallvec = "1.15"
strum = { version = "0.28", features = ["derive"] }
syn = "3.0.3"
tempfile = "3.24.0"
term-clipboard = { path = "crates/term-clipboard", version = "0.10.5-alpha" }
term-session = { path = "crates/term-session", version = "0.10.5-alpha" }
term-session-client = { path = "crates/term-session-client", version = "0.10.5-alpha" }
term-session-mock = { path = "crates/term-session-mock", version = "0.10.5-alpha" }
term-session-muxio-service-definitions = { path = "crates/term-session-muxio-service-definitions", version = "0.10.5-alpha" }
term-session-server = { path = "crates/term-session-server", version = "0.10.5-alpha" }
term-sys-io = { path = "crates/term-sys-io", version = "0.10.5-alpha" }
term-test-support = { path = "crates/term-test-support", version = "0.10.5-alpha" }
term-wm = { path = ".", version = "0.10.5-alpha" }
term-logging = { path = "crates/term-logging", version = "0.10.5-alpha" }
term-wm-config = { path = "crates/term-wm-config", version = "0.10.5-alpha" }
term-wm-console = { path = "crates/term-wm-console", version = "0.10.5-alpha" }
term-wm-core = { path = "crates/term-wm-core", version = "0.10.5-alpha", default-features = false }
term-wm-crossterm-adapter = { path = "crates/term-wm-crossterm-adapter", version = "0.10.5-alpha" }
term-wm-events = { path = "crates/term-wm-events", version = "0.10.5-alpha" }
term-wm-layout-engine = { path = "crates/term-wm-layout-engine", version = "0.10.5-alpha" }
term-wm-pty-engine = { path = "crates/term-wm-pty-engine", version = "0.10.5-alpha" }
term-wm-render = { path = "crates/term-wm-render", version = "0.10.5-alpha" }
term-wm-sys-ui-components = { path = "crates/term-wm-sys-ui-components", version = "0.10.5-alpha" }
term-wm-ui-components = { path = "crates/term-wm-ui-components", version = "0.10.5-alpha" }
term-wm-ui-facade = { path = "crates/term-wm-ui-facade", version = "0.10.5-alpha" }
term-wm-view = { path = "crates/term-wm-view", version = "0.10.5-alpha" }
term-wm-vt100 = "0.16.2-patch4"
textwrap = "0.16.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
file-rotate = "0.8.0"
unicode-width = "0.2.2"
vte = "0.15.0"
webbrowser = "1.2.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[workspace.lints.clippy]
unwrap_used = "deny"

[features]
default = ["session-persistence", "project-tasks", "pty"]
pty = ["term-wm-core/pty"]
project-tasks = ["term-wm-core/project-tasks"]
session-persistence = [
    "dep:term-session",
    "dep:tokio",
    "dep:muxio-rpc-service-caller",
    "dep:muxio-rpc-service-endpoint",
    "term-wm-config/session-persistence",
    "term-wm-core/session-persistence",
]

[dependencies]
clap = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
hostname = { workspace = true }
libc = { workspace = true }
term-logging = { workspace = true, features = ["ui"] }
line-ending = { workspace = true }
muxio-rpc-service-caller = { workspace = true, optional = true }
muxio-rpc-service-endpoint = { workspace = true, optional = true }
portable-pty = { workspace = true }
ratatui = { workspace = true }
term-session = { workspace = true, optional = true }
term-sys-io = { workspace = true }
term-wm-config = { workspace = true }
term-wm-console = { workspace = true }
term-wm-core = { workspace = true }
term-wm-layout-engine = { workspace = true }
term-wm-pty-engine = { workspace = true }
term-wm-render = { workspace = true }
term-wm-sys-ui-components = { workspace = true }
term-wm-ui-components = { workspace = true }
term-wm-ui-facade = { workspace = true }
term-wm-view = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
webbrowser = { workspace = true }

[build-dependencies]
indoc = { workspace = true }

[dev-dependencies]
interprocess = { workspace = true }
muxio-rpc-service = { workspace = true }
muxio-tokio-mpsc-adapter = { workspace = true }
muxio-tokio-rpc-ipc-client = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
term-clipboard = { workspace = true }
term-session-client = { workspace = true }
term-session-mock = { workspace = true }
term-session-muxio-service-definitions = { workspace = true }
term-session-server = { workspace = true }
term-test-support = { workspace = true, features = ["tokio"] }
term-wm-render = { workspace = true }
term-wm-vt100 = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

