[package]
name = "term-session"
description = "Run and share terminal sessions in a detached daemon and attach locally or over SSH."
keywords = ["terminal", "pty", "session", "multiplexer"]
categories = ["command-line-utilities", "emulators", "network-programming", "os"]
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "term-session"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
hostname = { workspace = true }
libc = { workspace = true }
muxio-tokio-rpc-ipc-client = { workspace = true }
term-logging = { workspace = true, features = ["daemon"] }
term-session-client = { workspace = true }
term-session-muxio-service-definitions = { workspace = true }
term-session-server = { workspace = true }
term-wm-config = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
interprocess = { workspace = true }
muxio-core = { workspace = true }
muxio-tokio-rpc-ipc-client = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
term-session-mock = { workspace = true }
term-test-support = { workspace = true, features = ["tokio"] }
tokio = { workspace = true }

[lints]
workspace = true
