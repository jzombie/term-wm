[package]
name = "term-session"
description = "Generic terminal session reproducer: run a PTY in a detached server and attach any number of terminals, locally or over SSH."
keywords = ["terminal", "pty", "session", "multiplexer"]
categories = ["command-line-utilities", "emulators", "network-programming", "os"]
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "term-session"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
hostname = { workspace = true }
libc = { workspace = true }
muxio-tokio-rpc-ipc-client = { workspace = true }
term-session-client = { workspace = true }
term-session-muxio-service-definitions = { workspace = true }
term-session-server = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
muxio-tokio-rpc-ipc-client = { workspace = true }
tokio = { workspace = true }
