[package]
name = "term-wm-crossterm-adapter"
description = "Crossterm-to-core event translation and terminal (mouse-capture) state adapter for term-wm."
keywords = ["crossterm", "terminal", "adapter", "backend"]
categories = ["gui", "api-bindings", "command-line-interface"]
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossterm = { workspace = true }
term-wm-events = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
portable-pty = { workspace = true }

# Test-only fixture spawned by `tests/nested_mouse.rs` inside a PTY pair so its
# stdin is a real console/ConPTY input handle. Never published.
[[bin]]
name = "mouse_test_probe"
path = "src/bin/mouse_test_probe.rs"
publish = false
