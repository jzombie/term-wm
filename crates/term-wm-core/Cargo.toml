[package]
name = "term-wm-core"
description = "Core window manager engine, runtime, and layout primitives for term-wm."
keywords = ["window-manager", "tiling", "layout", "events", "cross-platform"]
categories = ["gui", "command-line-interface", "concurrency", "data-structures"]
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["pty"]
pty = ["portable-pty"]
session-persistence = []

[dependencies]
bitflags = { workspace = true }
console = { workspace = true }
crossbeam-channel = { workspace = true }
linkify = { workspace = true }
nucleo-matcher = { workspace = true }
portable-pty = { workspace = true, optional = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true, features = ["derive"] }
term-clipboard = { workspace = true }
term-wm-events = { workspace = true }
term-wm-layout-engine = { workspace = true }
term-wm-pty-engine = { workspace = true }
term-wm-render = { workspace = true }
textwrap = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true
