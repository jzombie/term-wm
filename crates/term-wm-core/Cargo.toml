[package]
name = "term-wm-core"
description = "Core window manager engine, runtime, and layout primitives for term-wm."
keywords = ["window-manager", "tiling", "layout", "events", "cross-platform"]
categories = ["gui", "command-line-interface", "concurrency", "data-structures"]
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["pty", "project-tasks"]
pty = ["portable-pty"]
session-persistence = ["term-wm-config/session-persistence"]
project-tasks = ["dep:shell-words", "dep:serde_json"]

[dependencies]
bitflags = { workspace = true }
console = { workspace = true }
crossbeam-channel = { workspace = true }
linkify = { workspace = true }
nucleo-matcher = { workspace = true }
portable-pty = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true, features = ["derive"] }
term-clipboard = { workspace = true }
term-wm-config = { workspace = true }
term-wm-events = { workspace = true }
term-wm-layout-engine = { workspace = true }
term-wm-pty-engine = { workspace = true }
term-wm-render = { workspace = true }
textwrap = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
