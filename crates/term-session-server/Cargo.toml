[package]
name = "term-session-server"
description = "Detached server that hosts one PTY per channel and broadcasts it to every attached terminal."
keywords = ["server", "async", "tokio", "rpc", "pty"]
categories = ["network-programming", "asynchronous", "command-line-utilities"]
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = { workspace = true }
muxio-core = { workspace = true }
muxio-rpc-service = { workspace = true }
muxio-rpc-service-caller = { workspace = true }
muxio-rpc-service-endpoint = { workspace = true }
muxio-tokio-rpc-ipc-server = { workspace = true }
portable-pty = { workspace = true }
term-session-muxio-service-definitions = { workspace = true }
term-wm-pty-engine = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
term-wm-vt100 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
term-session-mock = { workspace = true }
