name: nightly-soak

on:
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: nightly soak (7 channels, 6 workloads)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Capture rustc commit hash
        id: rustc
        run: echo "hash=$(rustc -Vv | sed -n 's/^commit-hash: //p')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Calculate lockfile hash
        id: lockfile
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.rustc.outputs.hash }}-${{ steps.lockfile.outputs.hash }}-nightly-soak
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rustc.outputs.hash }}-
            ${{ runner.os }}-cargo-

      - name: Check mutex unwrap policy
        run: bash ci/check-mutex-unwrap.sh
        shell: bash

      - name: Run nightly soak
        env:
          RUN_NIGHTLY_SOAK: "1"
          SOAK_DURATION_SECS: "420"
          TERM_WM_LOG_FILE: "${{ github.workspace }}/test-logs/nightly-soak.log"
        run: |
          mkdir -p "${{ github.workspace }}/test-logs"
          cargo test --test nightly_soak -- --ignored --nocapture

      - name: Upload soak logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak-logs-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/test-logs/nightly-soak.log
            ${{ runner.temp }}/term-wm-test-logs/
          retention-days: 14
          if-no-files-found: ignore
